# Opt-in overlay. Install subscription_role.sql as owner, and configure a
# separate LOGIN inheriting messaging_subscriptions; never use the gateway DSN.
services:
  subscriptions:
    image: anymsg-subscriptions:${MESSAGING_VERSION:-0.9.18}
    build:
      context: ..
      target: runtime
    command: [python, -m, messaging_service.subscription_worker]
    init: true
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
    volumes:
      - type: bind
        source: ./private/subscriptions.dsn
        target: /run/secrets/database_url
        read_only: true
        bind: {create_host_path: false}
    networks: [backend]
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=16m,noexec,nosuid"]
    mem_limit: 256m
    cpu_shares: 512
    pids_limit: 32
    stop_grace_period: 15s
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
