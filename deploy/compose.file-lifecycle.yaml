# Explicit opt-in. Start in dry-run mode; applying eviction requires changing
# the command after checking the first report and reconciling pending backups.
services:
  file-lifecycle:
    profiles: [file-lifecycle]
    image: anymsg-api:${MESSAGING_VERSION:-0.9.9}
    init: true
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    command: [python, -m, messaging_service.file_lifecycle, --dsn-file, /run/secrets/database_url,
      --interval-seconds, "86400", --limit, "100", --max-bytes, "1073741824"]
    environment:
      PROBE_FILES: /data/files
    volumes:
      - type: bind
        source: ./private/file-lifecycle.dsn
        target: /run/secrets/database_url
        read_only: true
        bind: {create_host_path: false}
      - files:/data
    networks: [backend]
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=16m,noexec,nosuid"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 32
    stop_grace_period: 60s
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
