name: deedkit-gateway
services:
  gateway:
    image: deedkit-gateway:${DEEDKIT_VERSION:-0.1.0}
    build:
      context: ../services/gateway
    env_file: ./private/gateway.env
    command: ["--policy", "/run/deedkit/policy.json", "--public-url", "${DEEDKIT_PUBLIC_URL:?Set gateway HTTPS origin}", "--host", "0.0.0.0", "--port", "13240"]
    volumes:
      - ./private/gateway-policy.json:/run/deedkit/policy.json:ro
      - ./private/gateway-keys:/run/deedkit/keys:ro
    ports: ["127.0.0.1:13240:13240"]
    networks: [integration]
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    cpu_shares: 512
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=16m,noexec,nosuid"]
    mem_limit: 256m
    pids_limit: 64
    stop_grace_period: 15s
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
networks:
  integration:
    external: true
    name: ${DEEDKIT_NETWORK:-deedkit-integration}
