name: GHCR probe (temporary)
# Temporary, approved for PR "ci: publish the tested images to GHCR": proves that the job
# token alone can create a repository-linked GHCR package and attest it. Removed in the next
# commit of the same pull request; it never reaches main.
on:
  pull_request:
    paths: ['.github/workflows/ghcr-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read  # checkout of scripts/publish_images.py
      packages: write  # create ghcr.io/gosync-inc/deedkit-probe and push one tag
      id-token: write  # Sigstore signing certificate for the attestation
      attestations: write  # store the attestation in this repository's attestation API
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build a one-file image labelled with this repository
        run: |
          mkdir "$RUNNER_TEMP/probe"
          printf 'deedkit ghcr probe\n' > "$RUNNER_TEMP/probe/probe.txt"
          printf 'FROM scratch\nCOPY probe.txt /probe.txt\nLABEL org.opencontainers.image.source=https://github.com/GoSync-Inc/deedkit\n' \
            > "$RUNNER_TEMP/probe/Dockerfile"
          docker build --tag deedkit-probe:local "$RUNNER_TEMP/probe"
          docker save --output "$RUNNER_TEMP/probe.tar" deedkit-probe:local
      - name: Log in to GHCR with the job token
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
      - name: Push the archive with skopeo, as the publish job does
        id: push
        env:
          SHA: ${{ github.sha }}
        run: |
          skopeo --version
          # The first publication of a target must read a never-pushed GHCR tag as absent.
          python3 -c 'import sys; from scripts.publish_images import Registry; found = Registry("ghcr.io/gosync-inc").manifest(sys.argv[1]); print("absent" if found is None else found[0]); sys.exit(found is not None)' \
            "ghcr.io/gosync-inc/deedkit-probe:$SHA"
          skopeo copy --quiet "docker-archive:$RUNNER_TEMP/probe.tar" "docker://ghcr.io/gosync-inc/deedkit-probe:$SHA"
          python3 -c 'import sys; from scripts.publish_images import Registry; print("digest=" + Registry("ghcr.io/gosync-inc").manifest(sys.argv[1])[0])' \
            "ghcr.io/gosync-inc/deedkit-probe:$SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/gosync-inc/deedkit-probe
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Verify the attestation like the publish job does
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.push.outputs.digest }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          gh attestation verify "oci://ghcr.io/gosync-inc/deedkit-probe@$DIGEST" --repo GoSync-Inc/deedkit \
            --signer-workflow GoSync-Inc/deedkit/.github/workflows/ghcr-probe.yml --source-ref "$REF" \
            --source-digest "$SHA" --deny-self-hosted-runners
          echo "Published and attested ghcr.io/gosync-inc/deedkit-probe@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Log out of GHCR
        if: ${{ always() }}
        run: docker logout ghcr.io
