name: Publish npm
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version matching the selected vX.Y.Z tag
        required: true
        default: '0.9.12'
permissions:
  contents: read
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Require the version tag
        env: {VERSION: '${{ inputs.version }}', REF: '${{ github.ref }}'}
        run: |
          test "$REF" = "refs/tags/v$VERSION" || test "$REF" = "refs/heads/main"
  checks:
    needs: tag
    uses: ./.github/workflows/checks.yml
    with:
      version: ${{ inputs.version }}
      source_ref: refs/tags/v${{ inputs.version }}
  publish:
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/anymsg
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '24', registry-url: 'https://registry.npmjs.org'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: npm-dist, path: dist}
      - run: npm publish ./dist/*.tgz --access public --provenance
