name: Publish PyPI
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version matching the selected vX.Y.Z tag
        required: true
        default: '0.9.16'
permissions:
  contents: read
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Require the version tag
        env: {VERSION: '${{ inputs.version }}', REF: '${{ github.ref }}'}
        run: |
          test "$REF" = "refs/tags/v$VERSION"
  checks:
    needs: tag
    uses: ./.github/workflows/checks.yml
    with: {version: '${{ inputs.version }}'}
  publish:
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/anymsg/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: python-dist, path: dist}
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
