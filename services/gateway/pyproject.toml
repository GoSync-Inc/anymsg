[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "deedkit-gateway"
version = "0.1.0"
description = "Selected domain tools for agents; independent authenticated backends"
requires-python = ">=3.13,<3.14"
dependencies = [
  "deedkit-platform-contracts==0.1.0",
  "mcp==2.3.0", "fastapi==0.143.0", "starlette==1.8.0",
  "pydantic>=2.12,<3", "uvicorn==0.54.0", "httpx==0.28.1", "jsonschema>=4.25,<5",
]

[tool.uv.sources]
deedkit-platform-contracts = {path = "../../packages/platform-contracts"}

[project.scripts]
deedkit-gateway = "agent_gateway.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.15.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
